apiVersion: v1
kind: ServiceAccount
metadata:
  name: arch-repo-server
  namespace: arch-repo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arch-repo-server-role
  namespace: arch-repo
rules:
# Allow managing build jobs
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "delete"]
# Allow reading pods and streaming pod logs
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arch-repo-server-binding
  namespace: arch-repo
subjects:
- kind: ServiceAccount
  name: arch-repo-server
  namespace: arch-repo
roleRef:
  kind: Role
  name: arch-repo-server-role
  apiGroup: rbac.authorization.k8s.io
