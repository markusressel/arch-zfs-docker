apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arch-repo-ingress
  namespace: arch-repo
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: "nginx" # Adjust to your ingress controller (e.g. traefik, nginx)
  tls:
  - hosts:
    - zfs.example.com
    secretName: arch-repo-tls
  rules:
  - host: zfs.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: arch-repo-service
            port:
              number: 80
