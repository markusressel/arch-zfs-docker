name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests & Code Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Formatting
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "Unformatted files found:"
            echo "$diffs"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
