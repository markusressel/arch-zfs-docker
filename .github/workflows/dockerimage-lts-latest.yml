name: Docker Image LTS latest (Builder)

on:
  push:
    branches: [ main ]
    paths:
      - 'builder/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image      
        run: |
          cd builder
          REPOSITORY_NAME="zfslocal" REPOSITORY_PATH=/tmp VARIANT="lts" ./run-container.sh
      
      - uses: actions/upload-artifact@v4
        with:
          name: zfs-utils
          path: /tmp/zfs-utils*pkg.*
      - uses: actions/upload-artifact@v4
        with:
          name: zfs-linux-lts
          path: /tmp/zfs-linux-lts*pkg.*