# Publishes the documentation site (zensical.toml, docs/) and the demo of the web UI (/demo/) to GitHub Pages on
# every push to main.
# GitHub Pages must use "GitHub Actions" as its source (Settings > Pages > Build and deployment).
name: Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, and the newest one wins
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical
      # --strict: a broken link or anchor fails the build
      - run: zensical build --clean --strict
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The web UI with made-up data and no server (web/src/demo), next to the docs
      - run: npm ci && npm run build:demo
        working-directory: web
      - run: cp -r web/dist-demo site/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
